name: kaza
description: Kaza — evidence-based fitness tracking app with AI coaching.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera & image
  camera: ^0.10.5
  image_picker: ^1.0.4
  image: ^4.1.0
  cached_network_image: ^3.3.0

  # UI & State
  provider: ^6.4.0
  get: ^4.6.6
  fl_chart: ^0.65.0
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.0.0
  http: ^1.1.0
  dio: ^5.4.0

  # Local storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Notifications
  flutter_local_notifications: ^16.3.0

  # Google ML Kit for on-device pose detection
  google_mlkit_pose_detection: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  # Add asset folders here once they exist (assets/images/, assets/data/…) —
  # pubspec entries for paths that aren't on disk break `flutter pub get`.
  # Fonts come from google_fonts at runtime, so no bundled font files needed.
