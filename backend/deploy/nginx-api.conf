# Reverse proxy for the Kaza API. Place in /etc/nginx/sites-available/
# and symlink into sites-enabled, then run: certbot --nginx -d api.wisdombusara.com

server {
    listen 80;
    server_name api.wisdombusara.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Progress photo uploads can be a few MB.
        client_max_body_size 15M;
    }
}
