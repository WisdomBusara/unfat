# Reverse proxy for MinIO so progress photos are served over HTTPS at
# storage.wisdombusara.com instead of a bare IP:9000. Place in
# /etc/nginx/sites-available/ and symlink into sites-enabled, then run:
# certbot --nginx -d storage.wisdombusara.com
#
# After this is live, set MINIO_PUBLIC_URL=https://storage.wisdombusara.com
# in backend/.env and restart the API so new photo URLs use it.

server {
    listen 80;
    server_name storage.wisdombusara.com;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 15M;
    }
}
