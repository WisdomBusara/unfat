name: kaza_backend
description: Kaza API server — Dart Frog + Postgres + MinIO, self-hosted on VPS.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  dart_frog: ^1.1.0
  postgres: ^3.1.0
  bcrypt: ^1.1.3
  dart_jsonwebtoken: ^2.12.2
  minio: ^3.5.1
  uuid: ^4.3.3
  http: ^1.2.0
  crypto: ^3.0.3

dev_dependencies:
  test: ^1.24.0
  mocktail: ^1.0.3
  very_good_analysis: ^5.1.0
